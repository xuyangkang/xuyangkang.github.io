<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" rx="12" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Info Badge -->
  <g transform="translate(16, 20)">
    <rect width="70" height="22" rx="4" fill="#eff6ff" stroke="rgba(37,99,235,0.2)" stroke-width="1"/>
    <text x="35" y="15" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2563eb">第 2 式</text>
    
    <text x="78" y="16" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">折刀深蹲</text>
    <text x="368" y="16" text-anchor="end" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">🎯 股四头肌 / 髋屈肌</text>
  </g>

  <!-- Floor / Ground Line -->
  <line x1="30" y1="185" x2="370" y2="185" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Apparatus / Scene -->
  <rect x="250" y="115" width="60" height="10" rx="3" fill="#64748b"/><line x1="280" y1="125" x2="280" y2="185" stroke="#64748b" stroke-width="4"/>

  <!-- Figure Graphics (Start Pose & Finish Pose) -->
  
          <g stroke="#2563eb" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <!-- Squatting legs -->
            <polyline points="170,185 200,165 170,150"/>
            <line x1="170" y1="150" x2="230" y2="115"/>
            <circle cx="240" cy="105" r="10" fill="#2563eb"/>
            <!-- Hands supporting on desk -->
            <line x1="220" y1="120" x2="255" y2="115"/>
          </g>
        

  <!-- Trajectory / Motion Arrow -->
  <path d="M 180 135 L 180 155" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bottom Technique Cue -->
  <g transform="translate(200, 218)">
    <rect x="-140" y="-14" width="280" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.04))"/>
    <text x="0" y="1" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155">💡 要领：双手扶桌椅分担体重 · 顺畅全幅度下蹲到底</text>
  </g>
</svg>