<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kotlin Console</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #2b2b2b;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        #console {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        #console code {
            display: block;
            white-space: pre;
            font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            color: #a9b7c6;
            padding: 16px;
        }

        .kotlin-playground {
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            margin: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            border: none !important;
            border-radius: 0 !important;
            box-shadow: none !important;
        }

        .kotlin-playground .executable-fragment-wrapper,
        .kotlin-playground .executable-fragment {
            flex: 1 1 auto !important;
            display: flex !important;
            flex-direction: column !important;
            min-height: 0 !important;
            height: 100% !important;
        }

        .kotlin-playground .CodeMirror {
            flex: 1 1 auto !important;
            height: 100% !important;
            font-size: 14px;
            line-height: 1.5;
        }

        .kotlin-playground .js-code-output-executor {
            max-height: 40% !important;
            overflow-y: auto !important;
        }
    </style>
    <!-- Official JetBrains Kotlin Playground component (https://github.com/JetBrains/kotlin-playground) -->
    <script src="https://unpkg.com/kotlin-playground@1" data-selector=".kotlin-code"></script>
</head>

<body>
    <div id="console">
        <code class="kotlin-code" theme="darcula" data-autocomplete="true" lines="true">
fun main() {
    println("Hello, World!")
}
        </code>
    </div>
    <script>
        // Support Ctrl+Enter / Cmd+Enter shortcut to execute code
        document.addEventListener('keydown', function (e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                const runBtn = document.querySelector('.run-button, button[title*="Run"], [title*="Execute"], .executable-fragment-wrapper button');
                if (runBtn) {
                    e.preventDefault();
                    runBtn.click();
                }
            }
        });
    </script>
</body>

</html>
